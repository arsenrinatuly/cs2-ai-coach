services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: coach
      POSTGRES_DB: coach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "coach", "-d", "coach"]
      interval: 2s
      timeout: 3s
      retries: 15
  migrate:
    build: ./backend
    environment: &backend-env
      DATABASE_URL: ${DATABASE_URL:?Set the PostgreSQL SQLAlchemy URL in your environment}
      WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
  api:
    build: ./backend
    environment:
      <<: *backend-env
      COACH_MODEL: ${COACH_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      COACH_INPUT_USD_PER_MILLION: ${COACH_INPUT_USD_PER_MILLION:-}
      COACH_OUTPUT_USD_PER_MILLION: ${COACH_OUTPUT_USD_PER_MILLION:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - spool:/spool
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
  worker:
    build: ./backend
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "backend.ingestion"]
    volumes:
      - spool:/spool
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
volumes:
  database:
  spool:
